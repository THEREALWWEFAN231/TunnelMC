# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
	# check these on https://fabricmc.net/develop
	# Minecraft 26.1+ ships unobfuscated, so there are no Yarn mappings anymore.
	minecraft_version=26.2
	loader_version=0.19.3
	loom_version=1.17-SNAPSHOT
	fabric_api_version=0.155.2+26.2

# Bedrock protocol library (org.cloudburstmc.protocol), same coordinates GeyserMC
# currently builds against for modern Bedrock support.
	cloudburst_protocol_version=3.0.0.Beta12-20260602.165120-26
	cloudburst_protocol_codec_version=3.0.0.Beta12-20260602.165120-25
	cloudburst_math_version=2.0
	cloudburst_raknet_version=1.1.0.CR1-SNAPSHOT

# WebRTC (NetherNet transport) - JNI wrapper around Google's libwebrtc, the only practical way to
# get real ICE/DTLS/SCTP in a JVM. Pinned to windows-x86_64 since that's the tester's actual
# platform - the base artifact (no classifier) resolves natives for whatever OS *this build* runs
# on, which would be wrong (this is built in a Linux sandbox, not on the tester's machine).
	webrtc_java_version=0.14.0

# Mod Properties
	mod_version = 0.0.2
	maven_group = me.THEREALWWEFAN231
	archives_base_name = FunnelMC
