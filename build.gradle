plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
	// Bedrock protocol library (org.cloudburstmc.protocol / org.cloudburstmc.math / org.cloudburstmc.netty)
	maven {
		name = 'opencollab-snapshots'
		url = 'https://repo.opencollab.dev/maven-snapshots/'
	}
	maven {
		name = 'opencollab-releases'
		url = 'https://repo.opencollab.dev/maven-releases/'
	}
}

dependencies {
	// To change the versions see the gradle.properties file.
	// Minecraft 26.1+ ships unobfuscated, so there is no mappings() dependency anymore.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Bedrock Edition protocol library, bundled directly into the mod jar via Loom's `include`.
	// org.cloudburstmc.fastutil.* is excluded because it republishes the *same*
	// it.unimi.dsi.fastutil package tree at an older version (8.5.15) than the one vanilla
	// Minecraft already bundles (8.5.18) - having both on the classpath is a split-package
	// version conflict (NoSuchMethodError on methods only present in 8.5.18, e.g.
	// Int2ObjectMap#ofEntries), not a missing dependency. Excluding it lets everything fall back
	// to Minecraft's own newer copy, which is a superset.
	def bedrockProtocol = {
		exclude group: 'io.netty'
		exclude group: 'org.cloudburstmc.fastutil'
		exclude group: 'org.cloudburstmc.fastutil.commons'
		exclude group: 'org.cloudburstmc.fastutil.maps'
		exclude group: 'org.cloudburstmc.fastutil.sets'
	}
	implementation "org.cloudburstmc.protocol:common:${project.cloudburst_protocol_version}", bedrockProtocol
	include "org.cloudburstmc.protocol:common:${project.cloudburst_protocol_version}", bedrockProtocol

	implementation "org.cloudburstmc.protocol:bedrock-codec:${project.cloudburst_protocol_codec_version}", bedrockProtocol
	include "org.cloudburstmc.protocol:bedrock-codec:${project.cloudburst_protocol_codec_version}", bedrockProtocol

	implementation "org.cloudburstmc.protocol:bedrock-connection:${project.cloudburst_protocol_version}", bedrockProtocol
	include "org.cloudburstmc.protocol:bedrock-connection:${project.cloudburst_protocol_version}", bedrockProtocol

	implementation "org.cloudburstmc.math:immutable:${project.cloudburst_math_version}"
	include "org.cloudburstmc.math:immutable:${project.cloudburst_math_version}"

	implementation("org.cloudburstmc.netty:netty-transport-raknet:${project.cloudburst_raknet_version}") {
		exclude group: 'io.netty'
	}
	include("org.cloudburstmc.netty:netty-transport-raknet:${project.cloudburst_raknet_version}") {
		exclude group: 'io.netty'
	}

	// The artifacts above only get their own jar bundled by Loom's `include` - none of their own
	// transitive dependencies are pulled in automatically. These are the transitive libraries that
	// aren't already part of vanilla Minecraft's own dependency set (verified by diffing the
	// resolved runtimeClasspath with and without the block above), so without explicitly declaring
	// and including them here too, the game crashes with NoClassDefFoundError the first time one of
	// these classes is touched at runtime.
	def bedrockTransitives = [
		"org.cloudburstmc:nbt:3.0.4.Final",
		"org.bitbucket.b_c:jose4j:0.9.6",
		"net.jodah:expiringmap:0.5.10",
		"io.airlift:aircompressor:0.27",
		"com.nukkitx:natives:1.0.3",
		"com.fasterxml.jackson.core:jackson-annotations:2.18.0",
	]
	bedrockTransitives.each {
		implementation it
		include it
	}

	// NetherNet transport (WebRTC data channels) - no pure-Java WebRTC stack exists, so this is a
	// JNI wrapper around Google's libwebrtc. Two artifacts are needed: the unclassified one (the
	// actual Java classes - just picking a classifier alone gives a jar with only a native .dll/.so
	// and no .class files at all) and the windows-x86_64 classifier (the native library itself,
	// pinned explicitly since the unclassified artifact's transitive natives would resolve for
	// whatever OS *this build* runs on - a Linux sandbox - not the tester's actual Windows machine).
	implementation "dev.onvoid.webrtc:webrtc-java:${project.webrtc_java_version}"
	include "dev.onvoid.webrtc:webrtc-java:${project.webrtc_java_version}"
	implementation group: "dev.onvoid.webrtc", name: "webrtc-java", version: "${project.webrtc_java_version}", classifier: "windows-x86_64"
	include group: "dev.onvoid.webrtc", name: "webrtc-java", version: "${project.webrtc_java_version}", classifier: "windows-x86_64"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

// ensure that the encoding is set to UTF-8, no matter what the system default is
// this fixes some edge cases with special characters not displaying correctly
// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
tasks.withType(JavaCompile).configureEach {
	it.options.compilerArgs << "-Xmaxerrs" << "100000"
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

loom {
	mixin {
		defaultRefmapName = "funnelmc.refmap.json"
	}
}

jar {
	from "LICENSE"
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// select the repositories you want to publish to
	repositories {
		// uncomment to publish to the local maven
		// mavenLocal()
	}
}
